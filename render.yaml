# Render Blueprint — lucky-draw-api
# Render Dashboard → New → Blueprint → เลือก repo นี้
# ค่าที่ sync: false ต้องกรอกเองใน Dashboard (ห้าม commit ค่า secret)

services:
  - type: web
    name: lucky-draw-api
    runtime: node
    region: singapore          # ใกล้ลาวที่สุด
    plan: free                 # free จะ sleep หลังไม่มีคนใช้ 15 นาที (ตื่นช้า ~1 นาที) — UptimeRobot ping /api/health กันไว้
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "2"             # Vercel → Render = proxy 2 ชั้น (rate limit ต่อ IP ผู้เล่นถูกคน)
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: JWT_SECRET
        generateValue: true    # Render สุ่มค่าให้ (ยาวพอ)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false            # URL ของ frontend เช่น https://lucky-draw-web.onrender.com
      - key: PASSWORD_ENC_KEY
        sync: false            # ข้อความสุ่มยาว ≥ 32 ตัว — ใช้เข้ารหัสรหัสผ่านที่ระบบออกให้ (ห้ามเปลี่ยนภายหลัง)
      # เปิด/ปิดโปรด้วย status ในตาราง ld_campaigns (admin API) — ไม่ใช้ CAMPAIGN_START / CAMPAIGN_END แล้ว